<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projetos — Programação Front-end TADS 2026</title>
    <style>
      :root {
        --bg: #f5f5f5;
        --panel: #ffffff;
        --text: #1f2937;
        --muted: #4b5563;
        --border: #e5e7eb;
        --link: #1d4ed8;
        --link-hover: #163ea8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
      }

      main {
        max-width: 760px;
        margin: 64px auto;
        padding: 0 20px;
      }

      h1 {
        margin: 0 0 24px;
        font-size: clamp(1.8rem, 4vw, 2.5rem);
        line-height: 1.2;
        letter-spacing: -0.03em;
      }

      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        overflow: hidden;
      }

      li + li {
        border-top: 1px solid var(--border);
      }

      a {
        display: block;
        padding: 16px 20px;
        color: var(--link);
        text-decoration: none;
        font-weight: 600;
        transition: background-color 0.2s ease, color 0.2s ease;
      }

      a:hover,
      a:focus {
        background: #f8fafc;
        color: var(--link-hover);
        text-decoration: underline;
      }

      @media (max-width: 480px) {
        main {
          margin-top: 32px;
        }

        a {
          padding: 14px 16px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Projetos — Programação Front-end TADS 2026</h1>

      <ul>
        <li><a href="./tecboard/">tecboard</a></li>
      </ul>
    </main>
  </body>
</html>
